name: Build ZERO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install game and Capacitor dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/cli@7 @capacitor/android@7 @capacitor/core@7

      - name: Create Android project
        run: npx cap add android

      - name: Configure landscape and fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:screenOrientation="landscape"')
          s = s.replace('android:theme="@style/AppTheme.NoActionBar"', 'android:theme="@android:style/Theme.Material.Light.NoActionBar.Fullscreen"')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
