<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080d16">
  <meta name="description" content="ZERO - jogo FPS arcade 3D para navegador.">
  <title>ZERO</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main id="game-root">
    <canvas id="game-canvas" aria-label="Campo de jogo 3D"></canvas>

    <section id="menu" class="overlay">
      <div class="menu-panel">
        <div class="eyebrow">ARCADE FPS</div>
        <h1>ZERO</h1>
        <p>Entre no campo de treino.</p>
        <label for="quality">Qualidade gráfica</label>
        <select id="quality">
          <option value="high">Alta</option>
          <option value="medium" selected>Média</option>
          <option value="low">Baixa</option>
        </select>
        <label for="sensitivity">Sensibilidade <span id="sensitivity-value">1.0x</span></label>
        <input id="sensitivity" type="range" min="0.4" max="2.5" step="0.1" value="1">
        <button id="start-button" class="primary">JOGAR</button>
        <small>PC: WASD + mouse · Celular: controles na tela</small>
      </div>
    </section>

    <section id="hud" class="hidden" aria-live="polite">
      <div class="hud-top">
        <div class="hud-chip">VIDA <strong id="health">100</strong></div>
        <div class="hud-chip">ALVOS <strong id="score">0</strong></div>
        <div class="hud-chip">MUNIÇÃO <strong id="ammo">12 / 60</strong></div>
      </div>
      <div id="crosshair"><i></i><b></b></div>
      <div id="hit-feedback"></div>
      <div class="hud-bottom">
        <button id="camera-button" class="hud-button">CÂMERA</button>
        <button id="reload-button" class="hud-button">RECARREGAR</button>
        <button id="exit-button" class="hud-button">SAIR</button>
      </div>
      <div id="mobile-controls">
        <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
        <div id="look-zone" aria-label="Arraste para olhar"></div>
        <button id="fire-button" class="touch-button">DISPARAR</button>
        <button id="jump-button" class="touch-button">PULAR</button>
      </div>
    </section>

    <section id="pause-message" class="hidden">
      <div class="menu-panel compact">
        <h2>PAUSADO</h2>
        <button id="resume-button" class="primary">CONTINUAR</button>
      </div>
    </section>
    <div id="toast" role="status"></div>
  </main>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
